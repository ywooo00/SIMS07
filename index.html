<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기술정보 분류 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .tree-node-highlight { animation: highlight 3s ease-out; }
    @keyframes highlight {
      0% { background-color: #fef08a; box-shadow: 0 0 0 4px #facc15; }
      100% { background-color: transparent; box-shadow: none; }
    }
    .toggle-switch { transition: all 0.3s ease; }
    .toggle-switch-active { background-color: #22c55e; }
    .toggle-switch-inactive { background-color: #d1d5db; }
    .toggle-knob { transition: transform 0.3s ease; }
    .toggle-knob-active { transform: translateX(24px); }
  </style>
</head>
<body class="bg-gray-50">

  <!-- 헤더 -->
  <div class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-gray-900">기술정보 분류 관리</h1>
      <div class="text-sm text-gray-500">HOME &gt; 관리자 &gt; 기술정보관리 &gt; <span class="font-medium text-gray-900">기술정보 분류 관리</span></div>
    </div>
  </div>

  <!-- 대분류 선택 영역 -->
  <div class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="flex items-center gap-4">
      <label class="text-sm font-medium text-gray-700 shrink-0">대분류 선택</label>
      <div class="relative flex-1 max-w-md">
        <input
          type="text"
          id="majorCategorySearch"
          placeholder="대분류 검색..."
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 pr-10"
          autocomplete="off"
        />
        <svg class="w-4 h-4 text-gray-400 absolute right-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>

        <!-- 대분류 드롭다운 -->
        <div id="majorDropdown" class="hidden absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-20 max-h-64 overflow-y-auto">
          <!-- 동적 생성 -->
        </div>
      </div>
      <button
        onclick="openAddModal('major', null)"
        class="px-4 py-2 bg-blue-500 text-white rounded text-sm font-medium hover:bg-blue-600 shrink-0"
      >
        + 대분류 추가
      </button>
    </div>
  </div>

  <!-- 메인 콘텐츠 영역 -->
  <div id="mainContent" class="flex" style="height: calc(100vh - 145px);">
    <!-- 초기 상태: 대분류 미선택 -->
    <div id="emptyState" class="flex-1 flex items-center justify-center bg-gray-50 text-gray-400">
      <div class="text-center">
        <svg class="w-20 h-20 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        <p class="text-lg font-medium text-gray-500 mb-2">대분류를 먼저 선택하세요</p>
        <p class="text-sm">상단에서 대분류를 검색하거나 선택하면<br/>하위 분류 구조가 표시됩니다</p>
      </div>
    </div>

    <!-- 왼쪽: 하위 트리 (초기 숨김) -->
    <div id="leftTree" class="hidden w-80 bg-white border-r border-gray-200 flex flex-col h-full">
      <div class="p-4 border-b border-gray-200 shrink-0">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-gray-800 flex items-center gap-2">
            <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
            <span id="selectedMajorName">-</span>
          </h2>
          <span class="text-xs text-gray-400"><span id="nodeCount">0</span>개 항목</span>
        </div>

        <!-- 하위 검색 -->
        <div class="relative mb-3">
          <input
            type="text"
            id="subSearch"
            placeholder="하위 분류 검색..."
            class="w-full border border-gray-300 rounded px-3 py-2 pl-9 text-sm focus:ring-2 focus:ring-blue-500"
            autocomplete="off"
          />
          <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>

          <!-- 하위 검색 결과 드롭다운 -->
          <div id="subSearchResults" class="hidden absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-10 max-h-48 overflow-y-auto">
            <!-- 동적 생성 -->
          </div>
        </div>

        <!-- 펼침/접힘 버튼 -->
        <div class="flex gap-2 mb-3">
          <button onclick="expandAll()" class="flex-1 px-3 py-1.5 border border-gray-300 rounded text-xs text-gray-600 hover:bg-gray-50">전체 펼침</button>
          <button onclick="collapseAll()" class="flex-1 px-3 py-1.5 border border-gray-300 rounded text-xs text-gray-600 hover:bg-gray-50">전체 접힘</button>
        </div>

        <button
          onclick="openAddModal('sub', state.selectedMajorCategory)"
          class="w-full flex items-center justify-center gap-2 border border-blue-500 text-blue-500 px-4 py-2 rounded text-sm font-medium hover:bg-blue-50"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          분류 추가
        </button>
      </div>

      <div id="treeContainer" class="flex-1 overflow-y-auto">
        <!-- 동적 트리 생성 -->
      </div>
    </div>

    <!-- 오른쪽: 상세 정보 (초기 숨김) -->
    <div id="rightDetail" class="hidden flex-1 bg-gray-50 flex flex-col h-full overflow-hidden">
      <!-- 상세 헤더 -->
      <div class="bg-white border-b border-gray-200 px-6 py-4 shrink-0">
        <div class="flex items-center justify-between">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span id="nodeTypeLabel" class="text-xs px-2 py-0.5 rounded bg-green-100 text-green-700">분류</span>
              <span class="text-xs text-gray-400">코드: <span id="nodeCode">-</span></span>
            </div>
            <h2 id="nodeName" class="text-lg font-bold text-gray-900">-</h2>
          </div>
          <div class="flex items-center gap-3">
            <span id="toggleLabelOff" class="text-sm text-gray-400">미사용</span>
            <button
              id="useToggle"
              onclick="toggleUse()"
              class="relative w-12 h-6 rounded-full transition-colors toggle-switch toggle-switch-active"
            >
              <span id="toggleKnob" class="absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-transform toggle-knob-active" style="right: 4px; left:5px;"></span>
            </button>
            <span id="toggleLabelOn" class="text-sm text-gray-700 font-medium">사용</span>
          </div>
        </div>
      </div>

      <!-- 상세 컨텐츠 -->
      <div class="flex-1 overflow-y-auto p-6">
        <div class="space-y-6">
          <!-- 기본 정보 -->
          <div class="bg-white rounded-lg border border-gray-200 p-5">
            <h3 class="text-sm font-semibold text-gray-800 mb-4 flex items-center gap-2">
              <span class="w-1 h-4 bg-blue-500 rounded"></span>기본 정보
            </h3>
            <div id="detailFieldsContainer">
              <!-- 동적 생성 -->
            </div>
          </div>

          <!-- 하위 항목 -->
          <div id="childrenSection" class="hidden bg-white rounded-lg border border-gray-200 p-5">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-semibold text-gray-800 flex items-center gap-2">
                <span class="w-1 h-4 bg-green-500 rounded"></span>
                하위 <span id="childTypeName">-</span> (<span id="childCount">0</span>)
              </h3>
              <button
                id="addChildBtn"
                onclick="addChildItem()"
                class="text-sm text-blue-500 hover:text-blue-600 font-medium flex items-center gap-1"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                추가
              </button>
            </div>
            <div id="childrenTable">
              <!-- 동적 생성 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="bg-white border-t border-gray-200 px-6 py-4 shrink-0 flex items-center justify-between">
        <button class="px-4 py-2 border border-red-500 text-red-500 rounded text-sm font-medium hover:bg-red-50">삭제</button>
        <div class="flex gap-2">
          <button class="px-4 py-2 border border-gray-300 text-gray-700 rounded text-sm font-medium hover:bg-gray-50">초기화</button>
          <button class="px-6 py-2 bg-blue-500 text-white rounded text-sm font-medium hover:bg-blue-600">저장</button>
        </div>
      </div>
    </div>

    <!-- 노드 미선택 상태 (초기 숨김) -->
    <div id="noNodeSelected" class="hidden flex-1 flex items-center justify-center bg-gray-50 text-gray-400">
      <div class="text-center">
        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <p class="text-sm">왼쪽에서 분류를 선택하세요</p>
      </div>
    </div>
  </div>

  <!-- 모달 -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
      <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
        <h3 id="modalTitle" class="font-bold text-gray-800">추가</h3>
        <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>
      <div class="p-6 space-y-4">
        <div id="modalParentInfo" class="hidden bg-gray-50 rounded p-3">
          <p class="text-xs text-gray-500 mb-1">상위 항목</p>
          <p id="modalParentName" class="text-sm font-medium">-</p>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">코드 <span class="text-red-500">*</span></label>
          <input type="text" id="modalCode" placeholder="코드 입력" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">명칭 <span class="text-red-500">*</span></label>
          <input type="text" id="modalName" placeholder="명칭 입력" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
        </div>
        <div id="modalEngNameField">
          <label class="block text-sm text-gray-600 mb-1">약어명</label>
          <input type="text" id="modalEngName" placeholder="약어명 입력" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
        </div>
        <div id="modalProductKeyField" class="hidden">
          <label class="block text-sm text-gray-600 mb-1">제품 KEY</label>
          <input type="text" id="modalProductKey" placeholder="제품 KEY 입력" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-600 mb-1">사용여부</label>
            <select id="modalUse" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
              <option value="Y">사용</option>
              <option value="N">미사용</option>
            </select>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">정렬순서</label>
            <input type="number" id="modalSort" value="0" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-2 bg-gray-50">
        <button onclick="closeAddModal()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded text-sm font-medium hover:bg-white">취소</button>
        <button onclick="submitAddModal()" class="px-6 py-2 bg-blue-500 text-white rounded text-sm font-medium hover:bg-blue-600">추가</button>
      </div>
    </div>
  </div>

  <script>
    // 상태 관리
    const state = {
      majorCategoryList: [
        { code: '004054', name: '태블릿PC', count: 15 },
        { code: '004047', name: 'MINI PC', count: 8 },
        { code: '004049', name: 'HTPC', count: 5 },
        { code: '004053', name: '스마트폰', count: 12 },
        { code: '004066', name: '스토리지', count: 3 },
        { code: '004064', name: '통신장비', count: 7 },
        { code: '004060', name: 'RFID장비', count: 4 },
        { code: '004073', name: 'SOUND', count: 6 },
        { code: '004052', name: '멀티미디어', count: 9 },
        { code: '004048', name: 'All In One', count: 11 },
        { code: '004050', name: '전자칠판', count: 2 },
        { code: '004055', name: 'TV', count: 8 },
        { code: '004056', name: '프린터', count: 14 },
      ],
      selectedMajorCategory: null,
      subTree: [],
      expandedNodes: [],
      selectedNode: null,
      levelLabels: {
        major: '대분류',
        sub: '분류',
        majorGroup: '대그룹',
        group: '그룹'
      },
      levelColors: {
        sub: 'bg-green-100 text-green-700',
        majorGroup: 'bg-purple-100 text-purple-700',
        group: 'bg-orange-100 text-orange-700'
      },
      modalType: '',
      modalParent: null
    };

    // 샘플 하위 트리 데이터
    function getSubTree(majorCode) {
      if (majorCode === '004054') {
        return [
          {
            type: 'sub', id: 'sub-1', code: '004073', name: 'SOUND', engName: 'SOUND', use: 'Y', sort: 0,
            children: [
              {
                type: 'majorGroup', id: 'mg-1', code: '015', name: '기술정보대그룹', engName: '', use: 'Y', sort: 0,
                children: [
                  { type: 'group', id: 'grp-1', code: '015413', name: 'A101', productKey: '', use: 'Y', sort: 1, children: [] },
                  { type: 'group', id: 'grp-2', code: 'XDR', name: 'XDRPRO 802', productKey: '', use: 'Y', sort: 2, children: [] },
                ]
              },
              {
                type: 'majorGroup', id: 'mg-2', code: '016', name: '스피커그룹', engName: '', use: 'Y', sort: 1,
                children: [
                  { type: 'group', id: 'grp-3', code: '016001', name: '블루투스 스피커', productKey: '', use: 'Y', sort: 1, children: [] },
                ]
              }
            ]
          },
          {
            type: 'sub', id: 'sub-2', code: '004052', name: '멀티미디어', engName: '멀티미디어', use: 'Y', sort: 1,
            children: [
              {
                type: 'majorGroup', id: 'mg-3', code: '017', name: '영상장비', engName: '', use: 'Y', sort: 0,
                children: []
              }
            ]
          },
          { type: 'sub', id: 'sub-3', code: '004048', name: 'All In One', engName: 'All In One', use: 'Y', sort: 2, children: [] },
        ];
      } else if (majorCode === '004047') {
        return [
          { type: 'sub', id: 'sub-4', code: '004001', name: '메인보드', engName: '', use: 'Y', sort: 0, children: [] },
          { type: 'sub', id: 'sub-5', code: '004002', name: 'CPU', engName: '', use: 'Y', sort: 1, children: [] },
        ];
      }
      return [];
    }

    // 대분류 검색 기능
    const majorSearchInput = document.getElementById('majorCategorySearch');
    const majorDropdown = document.getElementById('majorDropdown');

    majorSearchInput.addEventListener('focus', () => {
      renderMajorDropdown('');
      majorDropdown.classList.remove('hidden');
    });

    majorSearchInput.addEventListener('input', (e) => {
      renderMajorDropdown(e.target.value);
      majorDropdown.classList.remove('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!majorSearchInput.contains(e.target) && !majorDropdown.contains(e.target)) {
        majorDropdown.classList.add('hidden');
      }
    });

    function renderMajorDropdown(search) {
      const filtered = state.majorCategoryList.filter(m =>
        m.code.toLowerCase().includes(search.toLowerCase()) ||
        m.name.toLowerCase().includes(search.toLowerCase())
      );

      if (filtered.length === 0) {
        majorDropdown.innerHTML = '<div class="px-3 py-4 text-sm text-gray-400 text-center">검색 결과가 없습니다</div>';
        return;
      }

      majorDropdown.innerHTML = filtered.map(m => `
        <div
          onclick="selectMajorCategory('${m.code}')"
          class="px-3 py-2 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-b-0 flex items-center justify-between ${
            state.selectedMajorCategory?.code === m.code ? 'bg-blue-50' : ''
          }"
        >
          <div>
            <span class="text-sm text-gray-800">${m.name}</span>
            <span class="text-xs text-gray-400 ml-2">(${m.code})</span>
          </div>
          <span class="text-xs text-gray-400">${m.count}개</span>
        </div>
      `).join('');
    }

    function selectMajorCategory(code) {
      const category = state.majorCategoryList.find(c => c.code === code);
      state.selectedMajorCategory = category;
      state.subTree = getSubTree(code);
      state.expandedNodes = [];
      state.selectedNode = null;

      majorSearchInput.value = category.name;
      majorDropdown.classList.add('hidden');

      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('leftTree').classList.remove('hidden');
      document.getElementById('noNodeSelected').classList.remove('hidden');
      document.getElementById('rightDetail').classList.add('hidden');

      document.getElementById('selectedMajorName').textContent = category.name;
      document.getElementById('nodeCount').textContent = flattenTree(state.subTree).length;

      renderTree();
    }

    // 트리 flat 변환
    function flattenTree(nodes, path = []) {
      let result = [];
      nodes.forEach(node => {
        const currentPath = [...path, { id: node.id, name: node.name, type: node.type }];
        result.push({ ...node, path: currentPath });
        if (node.children?.length) {
          result = result.concat(flattenTree(node.children, currentPath));
        }
      });
      return result;
    }

    // 하위 검색
    const subSearchInput = document.getElementById('subSearch');
    const subSearchResults = document.getElementById('subSearchResults');

    subSearchInput.addEventListener('input', (e) => {
      const search = e.target.value.trim();
      if (!search || state.subTree.length === 0) {
        subSearchResults.classList.add('hidden');
        return;
      }

      const allNodes = flattenTree(state.subTree);
      const filtered = allNodes.filter(node =>
        node.name.toLowerCase().includes(search.toLowerCase()) ||
        node.code.toLowerCase().includes(search.toLowerCase())
      ).slice(0, 10);

      if (filtered.length === 0) {
        subSearchResults.classList.add('hidden');
        return;
      }

      subSearchResults.innerHTML = filtered.map(result => `
        <div
          onclick="selectSearchResult('${result.id}')"
          class="px-3 py-2 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-b-0"
        >
          <p class="text-sm font-medium text-gray-800">${result.name}</p>
          <p class="text-xs text-gray-500">${result.path.map(p => p.name).join(' > ')}</p>
        </div>
      `).join('');

      subSearchResults.classList.remove('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!subSearchInput.contains(e.target) && !subSearchResults.contains(e.target)) {
        subSearchResults.classList.add('hidden');
      }
    });

    function selectSearchResult(nodeId) {
      const allNodes = flattenTree(state.subTree);
      const node = allNodes.find(n => n.id === nodeId);
      if (!node) return;

      const parentIds = node.path.slice(0, -1).map(p => p.id);
      state.expandedNodes = [...new Set([...state.expandedNodes, ...parentIds])];
      
      selectNode(node);
      subSearchInput.value = '';
      subSearchResults.classList.add('hidden');

      setTimeout(() => {
        const element = document.getElementById(`tree-node-${node.id}`);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth', block: 'center' });
          element.classList.add('tree-node-highlight');
          setTimeout(() => element.classList.remove('tree-node-highlight'), 3000);
        }
      }, 100);
    }

    // 트리 렌더링
    function renderTree() {
      const container = document.getElementById('treeContainer');
      if (state.subTree.length === 0) {
        container.innerHTML = `
          <div class="flex items-center justify-center h-full text-gray-400">
            <div class="text-center">
              <svg class="w-12 h-12 mx-auto mb-2 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
              </svg>
              <p class="text-sm">하위 분류가 없습니다</p>
              <p class="text-xs mt-1">[분류 추가] 버튼을 클릭하세요</p>
            </div>
          </div>
        `;
        return;
      }
      container.innerHTML = state.subTree.map(node => renderTreeNode(node, 0)).join('');
    }

    function renderTreeNode(node, depth) {
      const hasChildren = node.children?.length > 0;
      const isExpanded = state.expandedNodes.includes(node.id);
      const isSelected = state.selectedNode?.id === node.id;
      const childCount = countAll(node);

      let html = `
        <div>
          <div
            id="tree-node-${node.id}"
            class="flex items-center gap-2 py-2 px-3 cursor-pointer border-b border-gray-100 transition-all ${
              isSelected ? 'bg-blue-50' : 'hover:bg-gray-50'
            }"
            style="padding-left: ${depth * 16 + 12}px"
            onclick="selectNode(${JSON.stringify(node).replace(/"/g, '&quot;')})"
          >
            <button onclick="event.stopPropagation(); toggleNode('${node.id}')" class="w-4 h-4 flex items-center justify-center">
              ${hasChildren ? `
                <svg class="w-3 h-3 text-gray-400 transition-transform ${isExpanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              ` : ''}
            </button>
            <span class="text-xs ${node.type === 'sub' ? 'text-green-600' : node.type === 'majorGroup' ? 'text-purple-600' : 'text-orange-600'}">[${state.levelLabels[node.type]}]</span>
            <span class="text-sm ${isSelected ? 'font-medium text-blue-700' : 'text-gray-700'}">${node.name}</span>
            ${hasChildren ? `<span class="text-xs text-gray-400 ml-auto">${childCount}</span>` : ''}
            ${isSelected ? `
              <svg class="w-4 h-4 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" />
              </svg>
            ` : ''}
          </div>
      `;

      if (isExpanded && hasChildren) {
        html += node.children.map(child => renderTreeNode(child, depth + 1)).join('');
      }

      html += '</div>';
      return html;
    }

    function countAll(node) {
      if (!node.children?.length) return 0;
      return node.children.length + node.children.reduce((a, c) => a + countAll(c), 0);
    }

    function toggleNode(nodeId) {
      if (state.expandedNodes.includes(nodeId)) {
        state.expandedNodes = state.expandedNodes.filter(n => n !== nodeId);
      } else {
        state.expandedNodes.push(nodeId);
      }
      renderTree();
    }

    function expandAll() {
      state.expandedNodes = flattenTree(state.subTree).map(n => n.id);
      renderTree();
    }

    function collapseAll() {
      state.expandedNodes = [];
      renderTree();
    }

    function selectNode(node) {
      state.selectedNode = node;
      renderTree();

      document.getElementById('noNodeSelected').classList.add('hidden');
      document.getElementById('rightDetail').classList.remove('hidden');

      // 상세 헤더
      document.getElementById('nodeTypeLabel').textContent = state.levelLabels[node.type];
      document.getElementById('nodeTypeLabel').className = `text-xs px-2 py-0.5 rounded ${state.levelColors[node.type]}`;
      document.getElementById('nodeCode').textContent = node.code;
      document.getElementById('nodeName').textContent = node.name;

      // 토글
      const toggleBtn = document.getElementById('useToggle');
      const toggleKnob = document.getElementById('toggleKnob');
      const toggleLabelOn = document.getElementById('toggleLabelOn');
      const toggleLabelOff = document.getElementById('toggleLabelOff');

      if (node.use === 'Y') {
        toggleBtn.classList.add('toggle-switch-active');
        toggleBtn.classList.remove('toggle-switch-inactive');
        toggleKnob.classList.add('toggle-knob-active');
        toggleLabelOn.classList.add('font-medium', 'text-gray-700');
        toggleLabelOn.classList.remove('text-gray-400');
        toggleLabelOff.classList.add('text-gray-400');
        toggleLabelOff.classList.remove('font-medium', 'text-gray-700');
      } else {
        toggleBtn.classList.add('toggle-switch-inactive');
        toggleBtn.classList.remove('toggle-switch-active');
        toggleKnob.classList.remove('toggle-knob-active');
        toggleLabelOn.classList.add('text-gray-400');
        toggleLabelOn.classList.remove('font-medium', 'text-gray-700');
        toggleLabelOff.classList.add('font-medium', 'text-gray-700');
        toggleLabelOff.classList.remove('text-gray-400');
      }

      // 기본 정보 필드
      renderDetailFields(node);

      // 하위 항목
      renderChildren(node);
    }

    function toggleUse() {
      if (state.selectedNode) {
        state.selectedNode.use = state.selectedNode.use === 'Y' ? 'N' : 'Y';
        selectNode(state.selectedNode);
      }
    }

    function renderDetailFields(node) {
      const container = document.getElementById('detailFieldsContainer');

      if (node.type === 'group') {
        container.innerHTML = `
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm text-gray-600 mb-1">그룹코드 <span class="text-red-500">*</span></label>
              <input type="text" value="${node.code}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm bg-gray-50" readonly />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">그룹명 <span class="text-red-500">*</span></label>
              <input type="text" value="${node.name}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">제품 KEY</label>
              <input type="text" value="${node.productKey || ''}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">정렬순서</label>
              <input type="number" value="${node.sort}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm text-gray-600 mb-1">코드 <span class="text-red-500">*</span></label>
              <input type="text" value="${node.code}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm bg-gray-50" readonly />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">명칭 <span class="text-red-500">*</span></label>
              <input type="text" value="${node.name}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">약어명</label>
              <input type="text" value="${node.engName || ''}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">정렬순서</label>
              <input type="number" value="${node.sort}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
            </div>
          </div>
          ${node.type !== 'majorGroup' ? `
            <div class="grid grid-cols-5 gap-4">
              <div>
                <label class="block text-sm text-gray-600 mb-1">구분1</label>
                <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
              </div>
              <div>
                <label class="block text-sm text-gray-600 mb-1">구분2</label>
                <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
              </div>
              <div>
                <label class="block text-sm text-gray-600 mb-1">구분3</label>
                <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
              </div>
              <div>
                <label class="block text-sm text-gray-600 mb-1">구분4</label>
                <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
              </div>
              <div>
                <label class="block text-sm text-gray-600 mb-1">구분5</label>
                <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" />
              </div>
            </div>
          ` : ''}
        `;
      }
    }

    function getChildType(type) {
      const order = ['sub', 'majorGroup', 'group'];
      const idx = order.indexOf(type);
      return idx < order.length - 1 ? order[idx + 1] : null;
    }

    function renderChildren(node) {
      const childType = getChildType(node.type);
      const section = document.getElementById('childrenSection');

      if (!childType) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      document.getElementById('childTypeName').textContent = state.levelLabels[childType];
      document.getElementById('childCount').textContent = node.children?.length || 0;

      const tableContainer = document.getElementById('childrenTable');

      if (!node.children || node.children.length === 0) {
        tableContainer.innerHTML = '<div class="text-center py-8 text-gray-400"><p class="text-sm">하위 항목이 없습니다</p></div>';
        return;
      }

      tableContainer.innerHTML = `
        <table class="w-full text-sm border border-gray-200 rounded overflow-hidden">
          <thead class="bg-gray-50">
            <tr>
              <th class="py-2 px-3 text-left text-gray-600 border-b">코드</th>
              <th class="py-2 px-3 text-left text-gray-600 border-b">명칭</th>
              <th class="py-2 px-3 text-center text-gray-600 border-b">사용</th>
              <th class="py-2 px-3 text-center text-gray-600 border-b">정렬</th>
              <th class="py-2 px-3 text-center text-gray-600 border-b">관리</th>
            </tr>
          </thead>
          <tbody>
            ${node.children.map(child => `
              <tr class="hover:bg-gray-50 border-b border-gray-100">
                <td class="py-2 px-3 font-mono text-xs">${child.code}</td>
                <td class="py-2 px-3">${child.name}</td>
                <td class="py-2 px-3 text-center">
                  <span class="px-2 py-0.5 rounded text-xs ${child.use === 'Y' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">
                    ${child.use === 'Y' ? '사용' : '미사용'}
                  </span>
                </td>
                <td class="py-2 px-3 text-center">${child.sort}</td>
                <td class="py-2 px-3 text-center">
                  <button class="text-blue-500 text-xs">수정</button>
                  <span class="mx-1 text-gray-300">|</span>
                  <button class="text-red-500 text-xs">삭제</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function addChildItem() {
      const childType = getChildType(state.selectedNode.type);
      if (childType) {
        openAddModal(childType, state.selectedNode);
      }
    }

    // 모달
    function openAddModal(type, parent) {
      state.modalType = type;
      state.modalParent = parent;

      document.getElementById('modalTitle').textContent = `${state.levelLabels[type]} 추가`;

      if (parent) {
        document.getElementById('modalParentInfo').classList.remove('hidden');
        document.getElementById('modalParentName').textContent = parent.name;
      } else {
        document.getElementById('modalParentInfo').classList.add('hidden');
      }

      // 약어명/제품KEY 필드 표시/숨김
      if (type === 'group') {
        document.getElementById('modalEngNameField').classList.add('hidden');
        document.getElementById('modalProductKeyField').classList.remove('hidden');
      } else {
        document.getElementById('modalEngNameField').classList.remove('hidden');
        document.getElementById('modalProductKeyField').classList.add('hidden');
      }

      // 입력 초기화
      document.getElementById('modalCode').value = '';
      document.getElementById('modalName').value = '';
      document.getElementById('modalEngName').value = '';
      document.getElementById('modalProductKey').value = '';
      document.getElementById('modalUse').value = 'Y';
      document.getElementById('modalSort').value = '0';

      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function submitAddModal() {
      const code = document.getElementById('modalCode').value.trim();
      const name = document.getElementById('modalName').value.trim();

      if (!code || !name) {
        alert('코드와 명칭은 필수 입력 항목입니다.');
        return;
      }

      alert(`${state.levelLabels[state.modalType]} 추가 완료:\n코드: ${code}\n명칭: ${name}`);
      closeAddModal();
    }

    // 초기화
    renderMajorDropdown('');
  </script>
</body>
</html>
